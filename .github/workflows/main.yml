name: Build Alertivity (Apple Silicon Native)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Build Alertivity (Non-sandboxed, arm64)
        run: |
          xcodebuild \
            -scheme 'Alertivity (Non-sandboxed)' \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Alertivity.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 Alertivity.app，请检查构建日志"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alertivity-arm64
          path: ${{ steps.locate.outputs.APP_PATH }}
          retention-days: 7
