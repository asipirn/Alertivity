name: Build Alertivity (Apple Silicon Native)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14 # 明确指定 Apple Silicon 运行器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2' # 锁定稳定的 Xcode 版本，规避 Xcode 26 的 .help 编译报错

      - name: Confirm Apple Silicon architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Build Alertivity (Non-sandboxed, arm64)
        run: |
          xcodebuild \
            -scheme 'Alertivity (Non-sandboxed)' \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built .app
        id: locate
        run: |
          # 直接全盘搜索 DerivedData 下的所有 .app 文件，只要名字包含 Alertivity 就抓取
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep -i "Alertivity" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 Alertivity 产物，请检查构建日志"
            exit 1
          fi
          echo "找到应用路径: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alertivity-arm64
          path: ${{ steps.locate.outputs.APP_PATH }}
          retention-days: 7
