name: Build Alertivity (Apple Silicon Native)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Confirm Apple Silicon architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Build Alertivity (Non-sandboxed, arm64)
        run: |
          xcodebuild \
            -scheme 'Alertivity (Non-sandboxed)' \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep -i "Alertivity" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 Alertivity 产物，请检查构建日志"
            exit 1
          fi
          echo "找到应用路径: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          APP_PATH="${{ steps.locate.outputs.APP_PATH }}"
          APP_NAME=$(basename "$APP_PATH")
          APP_NAME_NO_EXT="${APP_NAME%.app}"
          
          echo "正在为 $APP_NAME 创建 DMG..."
          
          # 1. 创建一个临时文件夹用于存放打包内容
          mkdir -p dmg_staging
          
          # 2. 将编译好的 .app 复制到临时文件夹
          cp -R "$APP_PATH" dmg_staging/
          
          # 3. 创建一个指向 /Applications 的软链接（方便用户拖拽安装）
          ln -s /Applications dmg_staging/Applications
          
          # 4. 使用 hdiutil 压缩生成 DMG 文件 (-format UDZO 表示最高压缩率)
          hdiutil create -volname "$APP_NAME_NO_EXT" -srcfolder dmg_staging -ov -format UDZO "$APP_NAME_NO_EXT.dmg"
          
          echo "DMG 创建成功: $APP_NAME_NO_EXT.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alertivity-DMG-arm64
          path: "*.dmg"
          retention-days: 7
